name: Ecco Studio review image publication

on:
  push:
    branches: [security/ecco-review-release-20261102]

permissions:
  contents: read

concurrency:
  group: ecco-review-release-20261102
  cancel-in-progress: false

env:
  RELEASE_SOURCE_COMMIT: c1f50400c9eddf14f0ef4b61d2067a1da1c18df2

jobs:
  build:
    if: >-
      github.repository == 'i-am-dm/ecco-studio.com' &&
      github.event.repository.private == false &&
      github.event.created == true &&
      github.actor == 'i-am-dm' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
      image_id: ${{ steps.package.outputs.image_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Rebuild and verify exact reviewed application
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: bash .security-validation/ecco/run-native-validation.sh
      - name: Package only the successfully tested image
        id: package
        run: bash .security-validation/ecco/package-image.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: ecco-release-${{ github.run_id }}
          path: ${{ runner.temp }}/ecco-release-package/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive_sha256 }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/ecco-release-package
          merge-multiple: true
      - name: Verify and load image without executing application code
        run: |
          python3 .security-validation/ecco/verify-image-package.py
          gzip -dc "$RUNNER_TEMP/ecco-release-package/image.tar.gz" | docker load
          test "$(docker image inspect local/ecco-studio-ci:validation --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
      - name: Use existing federation only after successful validation
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: packpilot-461918
          workload_identity_provider: projects/896693139975/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-ecco-studio@packpilot-461918.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish one image to the existing registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash .security-validation/ecco/publish-image.sh
